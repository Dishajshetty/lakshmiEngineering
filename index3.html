<!DOCTYPE html>
<html>
<head>
<title>Simple Page</title>

<style>
body{
    font-family: Arial;
    margin:0;
}

/* Navbar */

nav{
    display:flex;
    justify-content:space-between;
    background:#333;
    color:white;
    padding:10px 20px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

/* Hero Section */

.hero{
    background:#eee;
    padding:60px;
    text-align:center;
}

/* Content */

.content{
    padding:40px;
}

.float-img{
    float:left;
    margin-right:20px;
}

/* Footer */

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>

<body>

<header>
<nav>
<h2>Logo</h2>
<ul>
<li>Home</li>
<li>About</li>
<li>Services</li>
<li>Contact</li>
</ul>
</nav>
</header>

<section class="hero">
<h1>Welcome to My Website</h1>
<p>This is hero section</p>
</section>

<section class="content">

<img src="https://via.placeholder.com/200" class="float-img">

<p>
This is sample content. The image is floating left and text flows around the image.
</p>

<p>
You can add more text here to see the floating effect.
</p>

</section>

<footer>
<p>© 2026 My Website</p>
</footer>

</body>
</html>
